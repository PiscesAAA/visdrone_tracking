# YOLOv8s with P2 layer
nc: 10 # VisDrone 有 10 个类别
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4  小目标特征
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  # ==========================================
  # 下面是我们新增的 P2 分支！
  # ==========================================
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 上采样
  - [[-1, 1], 1, Concat, [1]] # 17 cat backbone P2 融合 P2 特征
  - [-1, 3, C2f, [128]] # 18 (P2/4-xsmall) 新增的P2检测头

  # 下面走原有的 PANet 自底向上路径
  - [-1, 1, Conv, [128, 3, 2]] # 19 下采样
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 22 下采样
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 25 下采样
  - [[-1, 9], 1, Concat, [1]] # 26 cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large)

  # 最终检测头：输出 4 个尺度！顺序是 [P2, P3, P4, P5]
  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)